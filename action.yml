name: 'Upload or Download a Build Artifact'
description: 'Upload or download a build artifact that can be used by subsequent workflow steps, or download an artifact from a previous step.'
author: 'GitHub'
inputs:
  path:
    description: >
      When uploading: A file, directory or wildcard pattern that describes what to upload
      When downloading: The name of the directory to download the object into
    required: true
    default: './'
  if-no-files-found:
    description: >
      The desired behavior if no files are found using the provided path.

      Available Options:
        warn: Output a warning but do not fail the action
        error: Fail the action with an error message
        ignore: Do not output any warnings or errors, the action does not fail
    default: 'warn'
  retention-days:
    description: >
      Duration after which artifact will expire in days. 0 means using default retention.

      Minimum 1 day.
      Maximum 90 days unless changed from the repository settings page.
  direction:
    description: >
      Whether to upload or download
    default: 'upload'
  name:
    description: >
      A name for the folder
    default: 'upload-artifacts'
  concurrency:
    description: >
      The rate of concurrency
    default: '8'
  run-number:
    description: 'Github run number used to identify artifacts'
    default: ${{ github.run_number }}
  report-links-file:
    description: >
      Optional path to a TSV file containing report labels and artifact-relative paths or absolute URLs.
      Each line must be in the format label<TAB>path-or-url.
    required: false
  website-url:
    description: >
      Optional public website base URL used to convert artifact-relative report paths into published links.
    required: false
  report-summary-title:
    description: >
      Optional heading used when adding published report links to the GitHub Actions job summary.
    required: false
    default: 'Published Reports'
  report-summary-intro:
    description: >
      Optional paragraph shown before published report links in the GitHub Actions job summary.
    required: false
runs:
  using: node24
  main: 'dist/index.cjs'
